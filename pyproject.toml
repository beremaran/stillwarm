[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stillwarm"
version = "0.1.1"
description = "Automatic KV-cache session persistence for llama-server: save the model's 'notes' to disk, restore them after a restart, refuse incompatible files."
readme = "README.md"
requires-python = ">=3.9"
# ZERO runtime dependencies — by design.
dependencies = []
authors = [{name = "Vimal Nakrani", email = "vimalnak@gmail.com"}]
license = {file = "LICENSE"}
keywords = ["llama.cpp", "llama-server", "kv-cache", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["mypy>=1.8", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
check_untyped_defs = true
strict_equality = true
no_implicit_optional = true
extra_checks = true
warn_unreachable = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",  # incompatible with D211 (formatter uses D211)
  "D213",  # incompatible with D212 (formatter uses D212)
  "COM812",  # formatter manages trailing commas
  "S310",  # base_url is user-provided; the scheme is validated to http/https
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "ANN",  # pytest injects fixtures; typing them is noise
  "CPY001",  # no copyright header on test files
  "D",  # docstring rules don't apply to test scaffolding
  "INP001",  # test modules are standalone by design
  "PLR2004",  # literals in comparisons are the point of a test
  "S101",  # asserts are the test idiom
]
