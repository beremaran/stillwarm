[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stillwarm"
version = "0.3.0"
description = "Automatic KV-cache session persistence for llama-server: save the model's 'notes' to disk, restore them after a restart, refuse incompatible files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["httpx", "orjson"]
authors = [{name = "Vimal Nakrani", email = "vimalnak@gmail.com"}]
license = {file = "LICENSE"}
keywords = ["llama.cpp", "llama-server", "kv-cache", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pyrefly>=1.5", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
# Migrated from the mypy strict config (see pyrefly.org migration docs).
# preset "strict" rather than "legacy": the codebase is fully annotated, so
# the migration-stepping-stone preset (which relaxes override and unbound-name
# checks) would silently weaken the gate mypy strict used to be.
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.13"  # matches requires-python
python-platform = "all"  # OS-independent library
check-unannotated-defs = true  # mypy check_untyped_defs
infer-return-types = "never"  # mypy check_untyped_defs

[tool.pyrefly.errors]
implicit-any = "error"  # mypy disallow_any_generics (covers all implicit-Any sub-kinds)
implicit-any-parameter = "error"  # mypy disallow_untyped_defs
unannotated-return = "error"  # mypy disallow_untyped_defs
no-any-return = "error"  # mypy warn_return_any
redundant-cast = "error"  # mypy warn_redundant_casts (mypy fails the run; "warn" is non-fatal here)
unreachable = "error"  # mypy warn_unreachable
implicit-reexport = "error"  # mypy no_implicit_reexport
incompatible-comparison = "error"  # mypy strict_equality
unnecessary-comparison = "error"  # mypy strict_equality
unused-ignore = "error"  # mypy warn_unused_ignores
unused-type-ignore = "error"  # pyrefly is the only type checker; # type: ignore is dead weight

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",  # incompatible with D211 (formatter uses D211)
  "D213",  # incompatible with D212 (formatter uses D212)
  "COM812",  # formatter manages trailing commas
  "S310",  # base_url is user-provided; the scheme is validated to http/https
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "ANN",  # pytest injects fixtures; typing them is noise
  "CPY001",  # no copyright header on test files
  "D",  # docstring rules don't apply to test scaffolding
  "INP001",  # test modules are standalone by design
  "PLR2004",  # literals in comparisons are the point of a test
  "S101",  # asserts are the test idiom
]

