repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pyrefly-org/pyrefly-pre-commit
    rev: 1.5.0
    hooks:
      - id: pyrefly-check
        # project-checking mode: src/ and tests/ per [tool.pyrefly] in pyproject.toml
        pass_filenames: false
        # tests import pytest; pyrefly resolves it from this hook's environment
        additional_dependencies: ["pytest>=8", "httpx", "orjson"]